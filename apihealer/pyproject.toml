[project]
name = "apihealer"
version = "0.1.0"
description = "Detect breaking changes in an API contract and remediate the consuming code."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
apihealer = "apihealer.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apihealer*"]
